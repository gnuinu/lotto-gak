name: CI

# main 에 들어가기 전에 걸리는 게이트.
# deploy.yml 도 같은 검사를 하지만 그건 push 이후다 — PR 단계에서 먼저 막는다.

on:
  pull_request:
  # main 직접 push 도 확인한다(배포가 취소되거나 건너뛰는 경우 대비).
  push:
    branches: [main]
  workflow_dispatch:

# 같은 PR 에 새 커밋이 올라오면 이전 실행은 취소한다(배포와 달리 취소해도 안전).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 테스트
        run: npm test

      - name: 빌드
        run: npm run build

      # tsc 설정이 어긋나면 src/ 에 .js 를 emit 한다(실제로 겪은 문제).
      # .gitignore 가 막아주지만 그건 커밋만 막을 뿐이라, 여기서 원인을 드러낸다.
      - name: 소스 디렉터리에 emit 된 산출물이 없는지 확인
        run: |
          LEAKED=$(find src -name '*.js' -o -name '*.d.ts' | sort)
          if [ -n "$LEAKED" ]; then
            echo "tsc 가 src 에 파일을 emit 했습니다 (tsconfig 의 noEmit 설정 확인):"
            echo "$LEAKED"
            exit 1
          fi
