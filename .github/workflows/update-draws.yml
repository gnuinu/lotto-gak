name: Update draw data

# 당첨 번호(public/data/draws.json)를 주기적으로 갱신한다.
# 앱은 런타임에 외부 API 를 부르지 않는다 — 네트워크 접근은 여기서만 일어난다.

on:
  schedule:
    # 추첨은 토요일 20:35 KST(11:35 UTC). 결과가 올라온 뒤에 받는다.
    - cron: '0 13 * * 6' # 토 22:00 KST
    # 토요일 실행이 실패했거나 결과 반영이 늦었을 때를 위한 재시도.
    - cron: '0 1 * * 0' # 일 10:00 KST
  workflow_dispatch:
    inputs:
      probe:
        description: '수집하지 않고 조회 응답만 진단한다 (차단 여부 확인용)'
        type: boolean
        default: false
      max:
        description: '이번 실행에서 받을 최대 회차 수 (비우면 제한 없음)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: update-draws
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 의존성이 필요 없는 스크립트다(node 내장 fetch 만 쓴다). npm ci 를 건너뛴다.
      # 입력은 셸에 직접 끼워넣지 않고 환경 변수로 받는다.
      - name: 새 회차 수집
        env:
          PROBE: ${{ inputs.probe }}
          MAX: ${{ inputs.max }}
          # 런너 IP 가 막혀 있을 때의 탈출구.
          # 한국 IP 를 경유하는 조회 주소를 저장소 시크릿에 넣으면 그걸 쓴다.
          # 비어 있으면 스크립트가 기본 주소를 쓴다.
          LOTTO_API_URL: ${{ secrets.LOTTO_API_URL }}
        run: |
          ARGS=""
          if [ "$PROBE" = "true" ]; then
            ARGS="--probe"
          fi
          case "$MAX" in
            '' | *[!0-9]*) ;;
            *) ARGS="$ARGS --max=$MAX" ;;
          esac
          echo "실행: node scripts/update-draws.mjs $ARGS"
          node scripts/update-draws.mjs $ARGS

      - name: 변경 사항이 있으면 커밋
        id: commit
        run: |
          if git diff --quiet -- public/data/draws.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "새 회차가 없습니다. 커밋하지 않습니다."
            exit 0
          fi

          LATEST=$(node -e "const d=require('./public/data/draws.json').draws; console.log(d[d.length-1].round)")
          TOTAL=$(node -e "console.log(require('./public/data/draws.json').draws.length)")

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/draws.json
          git commit -m "chore(data): ${LATEST}회차까지 당첨 번호 갱신 (총 ${TOTAL}건)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # 데이터가 바뀐 경우에만 다시 배포한다.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
