name: Update draw data

# 당첨 번호(public/data/draws.json)를 주기적으로 갱신한다.
# 앱은 런타임에 외부 API 를 부르지 않는다 — 네트워크 접근은 여기서만 일어난다.

on:
  schedule:
    # 추첨은 토요일 20:35 KST(11:35 UTC). 결과가 올라온 뒤에 받는다.
    - cron: '0 13 * * 6' # 토 22:00 KST
    # 토요일 실행이 실패했거나 결과 반영이 늦었을 때를 위한 재시도.
    - cron: '0 1 * * 0' # 일 10:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-draws
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 의존성이 필요 없는 스크립트다(node 내장 fetch 만 쓴다). npm ci 를 건너뛴다.
      - name: 새 회차 수집
        run: node scripts/update-draws.mjs

      - name: 변경 사항이 있으면 커밋
        id: commit
        run: |
          if git diff --quiet -- public/data/draws.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "새 회차가 없습니다. 커밋하지 않습니다."
            exit 0
          fi

          LATEST=$(node -e "const d=require('./public/data/draws.json').draws; console.log(d[d.length-1].round)")
          TOTAL=$(node -e "console.log(require('./public/data/draws.json').draws.length)")

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/draws.json
          git commit -m "chore(data): ${LATEST}회차까지 당첨 번호 갱신 (총 ${TOTAL}건)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # 데이터가 바뀐 경우에만 다시 배포한다.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
